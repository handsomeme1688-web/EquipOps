# EquipOps 容器编排。当前包含 repairmind AI 服务；Java/MySQL/Redis/MQ/MinIO
# 按手册 Day35 全链路需求接入时扩展（java / mysql / redis / rabbitmq / minio）。
services:
  repairmind:
    build:
      context: ./repairmind-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      RM_LLM_STUB: "${RM_LLM_STUB:-1}"
      RM_LLM_API_KEY: "${RM_LLM_API_KEY:-}"
      RM_LLM_BASE_URL: "${RM_LLM_BASE_URL:-https://api.deepseek.com}"
      RM_LLM_MODEL: "${RM_LLM_MODEL:-deepseek-chat}"
      RM_LLM_CONNECT_TIMEOUT: "${RM_LLM_CONNECT_TIMEOUT:-3.0}"
      RM_LLM_READ_TIMEOUT: "${RM_LLM_READ_TIMEOUT:-30.0}"
      RM_JWT_SECRET: "${RM_JWT_SECRET:-dev-secret-change-me}"
      RM_ENABLE_JAVA: "${RM_ENABLE_JAVA:-0}"
      RM_JAVA_BASE_URL: "${RM_JAVA_BASE_URL:-http://java-api:8080}"
      RM_EMBED_DEVICE: "${RM_EMBED_DEVICE:-cpu}"
    volumes:
      # 挂载本机 HF 模型缓存，容器内即可用 BGE-M3（无需在镜像里再下 2GB）
      - "${HOME:-.}/.cache/huggingface:/root/.cache/huggingface:ro"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    restart: unless-stopped
